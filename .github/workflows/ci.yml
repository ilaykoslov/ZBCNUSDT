name: CI — Test & Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Test & Doğrulama
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: ⚙️ Node.js ${{ matrix.node-version }} kur
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Bağımlılıkları yükle
        run: npm ci

      - name: 🔍 Lint kontrol (ESLint)
        run: |
          npm install eslint --save-dev
          npx eslint server.js config.js || echo "Lint uyarıları var (blok değil)"
        continue-on-error: true

      - name: 🚀 Sunucuyu başlat
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Sunucu PID: $SERVER_PID"
          sleep 3
          echo "Sunucu testi..."
          curl -s http://localhost:3456/api/health | head -c 500
          echo ""
          kill $SERVER_PID 2>/dev/null || true

      - name: 📝 Sözleşme kontrolü
        run: |
          echo "✅ package.json kontrol ediliyor..."
          node -e "const p = require('./package.json'); console.log('İsim:', p.name, '| Versiyon:', p.version)"
          echo "✅ config.js kontrol ediliyor..."
          node -e "const c = require('./config.js'); console.log('Port:', c.server.port, '| Sembol:', c.api.symbol)"

  security:
    name: 🔒 Güvenlik Taraması
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: 🔍 Gitleaks (sır taraması)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: 🔍 npm audit
        run: |
          npm audit --audit-level=high || echo "npm audit uyarıları var (blok değil)"
        continue-on-error: true
